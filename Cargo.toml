[workspace]
members = [
    "samagon-aseprite",
]

[workspace.package]
version = "0.1.0"

[package]
name = "samagon"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1"
serde_json = "1"

[dependencies.clap]
version = "4"
features = [
    "derive",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.samagon-aseprite]
path = "samagon-aseprite"

[build-dependencies]
anyhow = "1"
bindgen = "0.73"
